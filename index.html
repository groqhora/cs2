<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D mashq xaritasi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="cross"></div>
<div id="zone"></div>
<div id="info">W A S D yurish · Probel sakrash · Shift sekin · Chap tugma: smoke · R: tozalash · F: uchish rejimi (Probel yuqoriga, Ctrl pastga)</div>

<div id="map-ui" class="panel">
  <label class="field">
    <span>Map</span>
    <select id="mapSelect" aria-label="Map tanlash"></select>
  </label>

  <label class="field">
    <span>Team</span>
    <select id="teamSelect" aria-label="Team tanlash">
      <option value="CT">Counter-Terrorists</option>
      <option value="T">Terrorists</option>
      <option value="Custom">Custom</option>
    </select>
  </label>

  <button id="uploadMapBtn" type="button">Upload map</button>
  <input id="customMapInput" type="file" accept=".glb,.gltf" hidden>
</div>

<div id="start">
  <h1>3D mashq xaritasi</h1>
  <p id="status">Xarita yuklanmoqda…</p>
  <p><button id="pick" type="button">Oʻz .glb xaritangizni tanlash</button></p>
  <p><b>Boshlash uchun bu yerga bosing</b></p>
</div>

<script src="https://jsdelivr.net"></script>
<script src="https://jsdelivr.net"></script>
<script src="main.js"></script>
</body>
</html>
